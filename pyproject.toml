[project]
name = "chatmaster-api"
version = "0.1.0"
description = "FastAPI service for the ChatMaster chatbot automation platform"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

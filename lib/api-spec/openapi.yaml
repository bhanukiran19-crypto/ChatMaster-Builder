openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ChatMaster workspace, dashboard, and flow-builder API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Current authenticated account and workspace
  - name: dashboard
    description: Workspace analytics
  - name: flows
    description: Chatbot flow builder
  - name: health
    description: Health operations
paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user and workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user and workspace membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get workspace flow analytics and recent activity
      security:
        - clerkSession: []
      responses:
        "200":
          description: Workspace dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
  /flows:
    get:
      operationId: listFlows
      tags: [flows]
      summary: List flows in the current workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Workspace flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flow"
        "401":
          description: Authentication required
    post:
      operationId: createFlow
      tags: [flows]
      summary: Create a draft flow
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowInput"
      responses:
        "201":
          description: Created flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: Invalid flow definition
        "401":
          description: Authentication required
  /flows/{flowId}:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFlow
      tags: [flows]
      summary: Get a flow in the current workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "401":
          description: Authentication required
        "404":
          description: Flow not found
    patch:
      operationId: updateFlow
      tags: [flows]
      summary: Update a draft flow or its publication status
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowUpdate"
      responses:
        "200":
          description: Updated flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: Invalid flow definition
        "401":
          description: Authentication required
        "404":
          description: Flow not found
    delete:
      operationId: deleteFlow
      tags: [flows]
      summary: Delete a flow
      security:
        - clerkSession: []
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFlowResult"
        "401":
          description: Authentication required
        "404":
          description: Flow not found
  /flows/{flowId}/validate:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: validateFlow
      tags: [flows]
      summary: Validate a flow graph before publishing
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowGraph"
      responses:
        "200":
          description: Flow validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowValidation"
        "401":
          description: Authentication required
        "404":
          description: Flow not found
  /flows/{flowId}/simulations:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: startFlowSimulation
      tags: [flows]
      summary: Start an isolated test run of the saved draft
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationStartInput"
      responses:
        "201":
          description: Simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowExecution"
        "401":
          description: Authentication required
        "404":
          description: Flow not found
        "422":
          description: Invalid simulation request
  /simulations/{simulationId}:
    parameters:
      - name: simulationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFlowSimulation
      tags: [flows]
      summary: Get a simulation owned by the current workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowExecution"
        "401":
          description: Authentication required
        "404":
          description: Simulation not found
  /simulations/{simulationId}/input:
    parameters:
      - name: simulationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendSimulationInput
      tags: [flows]
      summary: Continue a test run with a visitor message or button choice
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
      responses:
        "200":
          description: Updated simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowExecution"
        "401":
          description: Authentication required
        "404":
          description: Simulation not found
        "409":
          description: Simulation is not waiting for input
  /webhooks/events:
    get:
      operationId: listWebhookEventTypes
      tags: [webhooks]
      summary: List event types currently emitted by ChatMaster
      security:
        - clerkSession: []
      responses:
        "200":
          description: Supported event types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEventType"
        "401":
          description: Authentication required
  /webhooks/endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [webhooks]
      summary: List workspace webhook endpoints
      security:
        - clerkSession: []
      responses:
        "200":
          description: Webhook endpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          description: Authentication required
    post:
      operationId: createWebhookEndpoint
      tags: [webhooks]
      summary: Create an incoming or outgoing webhook endpoint
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointInput"
      responses:
        "201":
          description: Endpoint created; the signing secret is shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        "400":
          description: Invalid endpoint configuration
        "403":
          description: Workspace administrator access required
        "401":
          description: Authentication required
  /webhooks/endpoints/{endpointId}:
    parameters:
      - name: endpointId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWebhookEndpoint
      tags: [webhooks]
      summary: Update endpoint settings and event subscriptions
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointUpdate"
      responses:
        "200":
          description: Updated endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          description: Invalid endpoint configuration
        "401":
          description: Authentication required
        "403":
          description: Workspace administrator access required
        "404":
          description: Endpoint not found
    delete:
      operationId: deleteWebhookEndpoint
      tags: [webhooks]
      summary: Delete an endpoint and its delivery history
      security:
        - clerkSession: []
      responses:
        "204":
          description: Endpoint and its delivery history deleted
        "401":
          description: Authentication required
        "403":
          description: Workspace administrator access required
        "404":
          description: Endpoint not found
  /webhooks/endpoints/{endpointId}/rotate-secret:
    parameters:
      - name: endpointId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Replace an endpoint signing secret
      security:
        - clerkSession: []
      responses:
        "200":
          description: New secret shown only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretRotation"
        "401":
          description: Authentication required
        "403":
          description: Workspace administrator access required
        "404":
          description: Endpoint not found
  /webhooks/endpoints/{endpointId}/test:
    parameters:
      - name: endpointId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: testWebhookEndpoint
      tags: [webhooks]
      summary: Queue a signed test delivery
      security:
        - clerkSession: []
      responses:
        "202":
          description: Test delivery queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          description: Authentication required
        "403":
          description: Workspace administrator access required
        "404":
          description: Endpoint not found
  /webhooks/deliveries:
    parameters:
      - name: endpointId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: List recent delivery attempts for an endpoint
      security:
        - clerkSession: []
      responses:
        "200":
          description: Delivery history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        "401":
          description: Authentication required
        "404":
          description: Endpoint not found
  /webhooks/deliveries/{deliveryId}/retry:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: retryWebhookDelivery
      tags: [webhooks]
      summary: Retry a failed delivery
      security:
        - clerkSession: []
      responses:
        "202":
          description: Delivery queued for manual retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          description: Authentication required
        "403":
          description: Workspace administrator access required
        "404":
          description: Delivery not found
        "409":
          description: Delivery is not failed or the endpoint is disabled
  /webhooks/incoming/{endpointId}:
    parameters:
      - name: endpointId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-ChatMaster-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: "^[0-9]{10}$"
      - name: X-ChatMaster-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: "^v1=[a-f0-9]{64}$"
    post:
      operationId: receiveIncomingWebhook
      tags: [webhooks]
      summary: Accept a signed, idempotent incoming event
      description: The body must be signed as HMAC-SHA256 over the timestamp, a period, and the exact raw request bytes. Timestamps must be within five minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingWebhookEnvelope"
      responses:
        "202":
          description: Event accepted and queued for subscribed endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingWebhookResult"
        "200":
          description: Duplicate event already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingWebhookResult"
        "400":
          description: Invalid JSON or event envelope
        "401":
          description: Invalid signature or expired timestamp
        "404":
          description: Incoming endpoint not found
        "413":
          description: Request body is too large
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    CurrentUser:
      type: object
      required: [userId, email, name, workspaceId, workspaceName, role]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        role:
          type: string
          enum: [owner, admin, agent]
    DashboardSummary:
      type: object
      required: [flowCount, publishedFlowCount, nodeCount, recentFlows]
      properties:
        flowCount:
          type: integer
          minimum: 0
        publishedFlowCount:
          type: integer
          minimum: 0
        nodeCount:
          type: integer
          minimum: 0
        recentFlows:
          type: array
          items:
            $ref: "#/components/schemas/Flow"
    Flow:
      type: object
      required: [id, name, description, status, graph, draftVersion, publishedVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, published]
        graph:
          $ref: "#/components/schemas/FlowGraph"
        draftVersion:
          type: integer
          minimum: 1
        publishedVersion:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FlowInput:
      type: object
      required: [name, graph]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
          maxLength: 1000
        graph:
          $ref: "#/components/schemas/FlowGraph"
    FlowUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
          maxLength: 1000
        status:
          type: string
          enum: [draft, published]
        graph:
          $ref: "#/components/schemas/FlowGraph"
    FlowGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/FlowNode"
        edges:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/FlowEdge"
    FlowNode:
      type: object
      required: [id, type, position, data]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          enum: [trigger, message, condition, add_tag, update_field, delay, ai_response, human_handoff, end]
        position:
          $ref: "#/components/schemas/FlowPosition"
        data:
          $ref: "#/components/schemas/FlowNodeData"
    FlowPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
    FlowNodeData:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        text:
          type: ["string", "null"]
          maxLength: 2000
        condition:
          type: ["string", "null"]
          maxLength: 500
        buttons:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/FlowButton"
        triggerType:
          type: string
          enum: [conversation_start, keyword, incoming_message]
          default: conversation_start
        keywords:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
        messageType:
          type: string
          enum: [text, buttons]
          default: text
        conditionField:
          type: ["string", "null"]
          maxLength: 160
        conditionOperator:
          type: ["string", "null"]
          enum: [equals, not_equals, contains, not_contains, exists, not_exists, null]
        conditionValue:
          type: ["string", "null"]
          maxLength: 500
        tagName:
          type: ["string", "null"]
          maxLength: 80
        fieldName:
          type: ["string", "null"]
          maxLength: 120
        fieldValue:
          type: ["string", "null"]
          maxLength: 1000
        delaySeconds:
          type: ["integer", "null"]
          minimum: 0
          maximum: 86400
        aiPrompt:
          type: ["string", "null"]
          maxLength: 2000
        handoffNote:
          type: ["string", "null"]
          maxLength: 1000
    FlowButton:
      type: object
      required: [label]
      properties:
        id:
          type: ["string", "null"]
          maxLength: 80
        label:
          type: string
          minLength: 1
          maxLength: 80
        targetId:
          type: ["string", "null"]
          maxLength: 80
    FlowEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        source:
          type: string
          minLength: 1
          maxLength: 80
        target:
          type: string
          minLength: 1
          maxLength: 80
        label:
          type: ["string", "null"]
          maxLength: 120
        sourceHandle:
          type: ["string", "null"]
          maxLength: 120
        targetHandle:
          type: ["string", "null"]
          maxLength: 120
    FlowValidation:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: string
    SimulationStartInput:
      type: object
      properties:
        triggerType:
          type: string
          enum: [conversation_start, keyword, incoming_message]
          default: conversation_start
        message:
          type: ["string", "null"]
          maxLength: 2000
        context:
          type: object
          additionalProperties: true
    SimulationInput:
      type: object
      properties:
        message:
          type: ["string", "null"]
          maxLength: 2000
        buttonId:
          type: ["string", "null"]
          maxLength: 80
    FlowMessage:
      type: object
      required: [nodeId, text, buttons]
      properties:
        nodeId:
          type: string
        text:
          type: string
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/FlowButton"
    FlowTraceEntry:
      type: object
      required: [nodeId, nodeType, status, message, details]
      properties:
        nodeId:
          type: string
        nodeType:
          type: string
        status:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    FlowExecution:
      type: object
      required: [id, flowId, mode, status, flowVersion, stepsExecuted, currentNodeId, context, messages, trace, error, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        flowId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [simulation]
        status:
          type: string
          enum: [awaiting_input, waiting_for_agent, completed, failed]
        flowVersion:
          type: integer
          minimum: 1
        stepsExecuted:
          type: integer
          minimum: 0
          maximum: 100
        currentNodeId:
          type: ["string", "null"]
        context:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/FlowMessage"
        trace:
          type: array
          items:
            $ref: "#/components/schemas/FlowTraceEntry"
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeleteFlowResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WebhookEventType:
      type: object
      required: [eventType, description]
      properties:
        eventType:
          type: string
          enum: [flow.published, webhook.incoming.received]
        description:
          type: string
    WebhookEndpoint:
      type: object
      required: [id, name, direction, url, eventTypes, isEnabled, secretReference, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        direction:
          type: string
          enum: [outgoing, incoming]
        url:
          type: ["string", "null"]
          format: uri
        eventTypes:
          type: array
          items:
            type: string
            enum: [flow.published, webhook.incoming.received]
        isEnabled:
          type: boolean
        secretReference:
          type: ["string", "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WebhookEndpointInput:
      type: object
      required: [name, direction]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        direction:
          type: string
          enum: [outgoing, incoming]
        url:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
        eventTypes:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            enum: [flow.published, webhook.incoming.received]
    WebhookEndpointUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
        eventTypes:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            enum: [flow.published, webhook.incoming.received]
        isEnabled:
          type: boolean
    WebhookEndpointCreated:
      type: object
      required: [endpoint, signingSecret, inboundPath]
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        signingSecret:
          type: string
          description: Displayed only in this creation response.
        inboundPath:
          type: ["string", "null"]
          description: Relative signed-ingress path for incoming endpoints.
    WebhookSecretRotation:
      type: object
      required: [signingSecret, secretReference]
      properties:
        signingSecret:
          type: string
          description: Displayed only in this rotation response.
        secretReference:
          type: string
          format: uuid
    WebhookDeliveryAttempt:
      type: object
      required: [id, attemptNumber, status, requestStartedAt, finishedAt, responseStatus, errorMessage]
      properties:
        id:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          type: string
          enum: [in_progress, succeeded, failed]
        requestStartedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        responseStatus:
          type: ["integer", "null"]
        errorMessage:
          type: ["string", "null"]
    WebhookDelivery:
      type: object
      required: [id, endpointId, eventId, eventType, status, attemptCount, retryCount, nextAttemptAt, httpStatus, lastError, createdAt, updatedAt, attempts]
      properties:
        id:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventType:

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ChatMaster workspace, dashboard, and flow-builder API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Current authenticated account and workspace
  - name: dashboard
    description: Workspace analytics
  - name: flows
    description: Chatbot flow builder
  - name: health
    description: Health operations
paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user and workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user and workspace membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get workspace flow analytics and recent activity
      security:
        - clerkSession: []
      responses:
        "200":
          description: Workspace dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
  /flows:
    get:
      operationId: listFlows
      tags: [flows]
      summary: List flows in the current workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Workspace flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flow"
        "401":
          description: Authentication required
    post:
      operationId: createFlow
      tags: [flows]
      summary: Create a draft flow
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowInput"
      responses:
        "201":
          description: Created flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: Invalid flow definition
        "401":
          description: Authentication required
  /flows/{flowId}:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFlow
      tags: [flows]
      summary: Get a flow in the current workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "401":
          description: Authentication required
        "404":
          description: Flow not found
    patch:
      operationId: updateFlow
      tags: [flows]
      summary: Update a draft flow or its publication status
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowUpdate"
      responses:
        "200":
          description: Updated flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: Invalid flow definition
        "401":
          description: Authentication required
        "404":
          description: Flow not found
    delete:
      operationId: deleteFlow
      tags: [flows]
      summary: Delete a flow
      security:
        - clerkSession: []
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFlowResult"
        "401":
          description: Authentication required
        "404":
          description: Flow not found
  /flows/{flowId}/validate:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: validateFlow
      tags: [flows]
      summary: Validate a flow graph before publishing
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowGraph"
      responses:
        "200":
          description: Flow validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowValidation"
        "401":
          description: Authentication required
        "404":
          description: Flow not found
  /flows/{flowId}/simulations:
    parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: startFlowSimulation
      tags: [flows]
      summary: Start an isolated test run of the saved draft
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationStartInput"
      responses:
        "201":
          description: Simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowExecution"
        "401":
          description: Authentication required
        "404":
          description: Flow not found
        "422":
          description: Invalid simulation request
  /simulations/{simulationId}:
    parameters:
      - name: simulationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFlowSimulation
      tags: [flows]
      summary: Get a simulation owned by the current workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowExecution"
        "401":
          description: Authentication required
        "404":
          description: Simulation not found
  /simulations/{simulationId}/input:
    parameters:
      - name: simulationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendSimulationInput
      tags: [flows]
      summary: Continue a test run with a visitor message or button choice
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
      responses:
        "200":
          description: Updated simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowExecution"
        "401":
          description: Authentication required
        "404":
          description: Simulation not found
        "409":
          description: Simulation is not waiting for input
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    CurrentUser:
      type: object
      required: [userId, email, name, workspaceId, workspaceName, role]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        role:
          type: string
          enum: [owner, admin, agent]
    DashboardSummary:
      type: object
      required: [flowCount, publishedFlowCount, nodeCount, recentFlows]
      properties:
        flowCount:
          type: integer
          minimum: 0
        publishedFlowCount:
          type: integer
          minimum: 0
        nodeCount:
          type: integer
          minimum: 0
        recentFlows:
          type: array
          items:
            $ref: "#/components/schemas/Flow"
    Flow:
      type: object
      required: [id, name, description, status, graph, draftVersion, publishedVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, published]
        graph:
          $ref: "#/components/schemas/FlowGraph"
        draftVersion:
          type: integer
          minimum: 1
        publishedVersion:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FlowInput:
      type: object
      required: [name, graph]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
          maxLength: 1000
        graph:
          $ref: "#/components/schemas/FlowGraph"
    FlowUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
          maxLength: 1000
        status:
          type: string
          enum: [draft, published]
        graph:
          $ref: "#/components/schemas/FlowGraph"
    FlowGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/FlowNode"
        edges:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/FlowEdge"
    FlowNode:
      type: object
      required: [id, type, position, data]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          enum: [trigger, message, condition, add_tag, update_field, delay, ai_response, human_handoff, end]
        position:
          $ref: "#/components/schemas/FlowPosition"
        data:
          $ref: "#/components/schemas/FlowNodeData"
    FlowPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
    FlowNodeData:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        text:
          type: ["string", "null"]
          maxLength: 2000
        condition:
          type: ["string", "null"]
          maxLength: 500
        buttons:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/FlowButton"
        triggerType:
          type: string
          enum: [conversation_start, keyword, incoming_message]
          default: conversation_start
        keywords:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
        messageType:
          type: string
          enum: [text, buttons]
          default: text
        conditionField:
          type: ["string", "null"]
          maxLength: 160
        conditionOperator:
          type: ["string", "null"]
          enum: [equals, not_equals, contains, not_contains, exists, not_exists, null]
        conditionValue:
          type: ["string", "null"]
          maxLength: 500
        tagName:
          type: ["string", "null"]
          maxLength: 80
        fieldName:
          type: ["string", "null"]
          maxLength: 120
        fieldValue:
          type: ["string", "null"]
          maxLength: 1000
        delaySeconds:
          type: ["integer", "null"]
          minimum: 0
          maximum: 86400
        aiPrompt:
          type: ["string", "null"]
          maxLength: 2000
        handoffNote:
          type: ["string", "null"]
          maxLength: 1000
    FlowButton:
      type: object
      required: [label]
      properties:
        id:
          type: ["string", "null"]
          maxLength: 80
        label:
          type: string
          minLength: 1
          maxLength: 80
        targetId:
          type: ["string", "null"]
          maxLength: 80
    FlowEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        source:
          type: string
          minLength: 1
          maxLength: 80
        target:
          type: string
          minLength: 1
          maxLength: 80
        label:
          type: ["string", "null"]
          maxLength: 120
        sourceHandle:
          type: ["string", "null"]
          maxLength: 120
        targetHandle:
          type: ["string", "null"]
          maxLength: 120
    FlowValidation:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: string
    SimulationStartInput:
      type: object
      properties:
        triggerType:
          type: string
          enum: [conversation_start, keyword, incoming_message]
          default: conversation_start
        message:
          type: ["string", "null"]
          maxLength: 2000
        context:
          type: object
          additionalProperties: true
    SimulationInput:
      type: object
      properties:
        message:
          type: ["string", "null"]
          maxLength: 2000
        buttonId:
          type: ["string", "null"]
          maxLength: 80
    FlowMessage:
      type: object
      required: [nodeId, text, buttons]
      properties:
        nodeId:
          type: string
        text:
          type: string
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/FlowButton"
    FlowTraceEntry:
      type: object
      required: [nodeId, nodeType, status, message, details]
      properties:
        nodeId:
          type: string
        nodeType:
          type: string
        status:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    FlowExecution:
      type: object
      required: [id, flowId, mode, status, flowVersion, currentNodeId, context, messages, trace, error, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        flowId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [simulation]
        status:
          type: string
          enum: [awaiting_input, waiting_for_agent, completed, failed]
        flowVersion:
          type: integer
          minimum: 1
        currentNodeId:
          type: ["string", "null"]
        context:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/FlowMessage"
        trace:
          type: array
          items:
            $ref: "#/components/schemas/FlowTraceEntry"
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeleteFlowResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

